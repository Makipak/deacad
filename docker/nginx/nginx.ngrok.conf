# Reverse proxy khusus demo ngrok — MENYATUKAN tiga service yang jalan di HOST (pnpm dev +
# docker infra) ke SATU origin: / -> web dev server (3000), /api/ -> api (4000),
# /deacad/ -> bucket MinIO (9000, path bucket = URL gambar halaman/thumbnail di DB).
#
# Kenapa harus satu origin: refresh token di-set sebagai cookie SameSite=Strict
# (auth.controller.ts) — kalau web dan api di-tunnel ke dua domain ngrok berbeda, cookie itu
# tidak akan pernah terkirim dan sesi login hilang setiap reload. Satu tunnel ke proxy ini
# membuat semuanya same-origin persis seperti production (docker/nginx/nginx.conf).
#
# Jalankan (Docker Desktop, host.docker.internal otomatis tersedia):
#   docker run --rm -p 8080:80 -v "${PWD}/docker/nginx/nginx.ngrok.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine
# lalu: ngrok http 8080

events {
  worker_connections 1024;
}

http {
  # Websocket upgrade untuk HMR Next.js dev server — tanpa ini halaman tetap tampil tapi
  # koneksi live-reload gagal terus dan menuh-menuhin log.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 80;
    server_name _;

    # Ukuran body dinaikkan — upload dokumen PDF/PPTX bisa cukup besar (batas app 50MB).
    client_max_body_size 55m;

    location /api/ {
      proxy_pass http://host.docker.internal:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Path bucket MinIO — akses anonim read-only sudah diaktifkan di bucket (lihat CLAUDE.md),
    # jadi cukup diteruskan apa adanya tanpa signature.
    location /deacad/ {
      proxy_pass http://host.docker.internal:9000;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://host.docker.internal:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
